name: Android checks and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current app version as a downloadable release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Tests, lint, and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore existing app signing identity
        env:
          SIGNING_KEY: ${{ secrets.APPLOCK_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo '::error::APPLOCK_KEYSTORE_BASE64 repository secret is missing.'
            exit 1
          fi
          SIGNING_DIR="$RUNNER_TEMP/app-lock-android"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$SIGNING_DIR/debug.keystore"
          chmod 600 "$SIGNING_DIR/debug.keystore"
          echo "ANDROID_USER_HOME=$SIGNING_DIR" >> "$GITHUB_ENV"
      - name: Build update APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify signing identity and read version
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" |
            grep -F 'Signer #1 certificate SHA-256 digest: b67e9d7cb3ecc143c6b31c2a7a30d905657cd58c4167f617515383ebdd530754'
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'versionName\s*=\s*"([0-9.]+)"', Path('app/build.gradle.kts').read_text()).group(1)
          tag = 'v' + (version + '.0' if version.count('.') == 1 else version)
          if os.environ['GITHUB_REF'].startswith('refs/tags/') and os.environ['GITHUB_REF_NAME'] != tag:
              raise SystemExit('Tag must match versionName: ' + tag)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'APP_VERSION={version}\nRELEASE_TAG={tag}\n')
          PY
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo '::error::This version already has a release. Increase versionName and versionCode.'
            exit 1
          fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Simple-App-Lock-v$APP_VERSION.apk"
          gh release create "$RELEASE_TAG" "dist/Simple-App-Lock-v$APP_VERSION.apk" \
            --target "$GITHUB_SHA" --prerelease --title "Simple App Lock v$APP_VERSION" \
            --notes-file .github/release-notes.md
      - name: Remove signing material
        if: always()
        run: rm -f "$ANDROID_USER_HOME/debug.keystore"
